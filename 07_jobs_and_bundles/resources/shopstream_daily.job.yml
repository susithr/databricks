resources:
  jobs:
    shopstream_daily:
      name: shopstream_daily_${bundle.target}
      description: Land -> Bronze -> Silver -> (Gold revenue || Gold LTV) -> DQ gate

      # Job parameters are pushed down to every notebook task as widgets.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      schedule:
        quartz_cron_expression: "0 30 6 * * ?"   # 06:30 every day
        timezone_id: UTC
        # pause_status is forced to PAUSED in dev mode automatically

      max_concurrent_runs: 1
      timeout_seconds: 3600
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      tasks:
        - task_key: land_data
          notebook_task:
            notebook_path: ../src/notebooks/00_land_data.py

        - task_key: bronze
          depends_on: [{ task_key: land_data }]
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze.py
          max_retries: 1          # Auto Loader schema evolution fails once on purpose, so a retry picks it up
          min_retry_interval_millis: 10000

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ../src/notebooks/02_silver.py

        # these two run in parallel
        - task_key: gold_revenue
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/notebooks/03_gold.py
            base_parameters: { table: daily_revenue }

        - task_key: gold_ltv
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ../src/notebooks/03_gold.py
            base_parameters: { table: customer_ltv }

        - task_key: dq_gate
          depends_on: [{ task_key: gold_revenue }, { task_key: gold_ltv }]
          notebook_task:
            notebook_path: ../src/notebooks/04_dq_gate.py
            base_parameters:
              max_bad_pct: ${var.dq_max_bad_pct}

      # No cluster is defined, so notebook tasks run on serverless compute.
      # For classic compute you would add:
      # job_clusters:
      #   - job_cluster_key: main
      #     new_cluster: { spark_version: 16.4.x-scala2.12, node_type_id: i3.xlarge, num_workers: 2 }
      # and `job_cluster_key: main` on each task.
